[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transfergap"
version = "0.1.0"
description = "Find and explain potential transit transfer risks from GTFS schedules and observed arrivals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TransferGap contributors" }]
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8.0,<9", "ruff>=0.8,<1"]

[project.scripts]
transfergap = "transfergap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
